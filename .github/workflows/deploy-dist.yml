name: Deploy Angular FE to GitHub Pages

on:
  push:
    branches:
      - main  # Change to 'master' if your default branch is master
    paths:
      - 'dist/**'  # Triggers whenever files in dist/ change

  workflow_dispatch:  # Allows manual triggers from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Points directly to the folder containing index.html
          path: './dist/angular-fe/browser'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4