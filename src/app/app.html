<app-toast></app-toast>
<div class="app-wrapper">
  <!-- Header -->
  <header class="header">
    <div class="container" style="display: flex; align-items: center; gap: 24px; justify-content: center;">
      <img src="avito.png" alt="Avito Logo" class="header-logo" />
      <div>
        <h1 class="header-title">
          <!-- <span class="header-icon">📄</span> -->
          Packing Lists to Bills of Lading
        </h1>
        <p class="header-subtitle">Create HBLs from packing lists, then consolidate completed HBLs into a carrier MBL.</p>
      </div>
    </div>
  </header>

  <main class="container main-layout">
    <div class="left-panel" [class.full-width]="hblReviews.length === 0">
      <app-uploader #uploader (filesSelected)="processFiles($event)"></app-uploader>
    </div>

    <div class="right-panel" *ngIf="hblReviews.length > 0">
      <div class="card mb-6" style="padding: 0; overflow: hidden; border: 1px solid #cbd5e1; box-shadow: none;">
        <div class="accordion-header" (click)="isMultiSelectOpen = !isMultiSelectOpen" style="background: white; cursor: pointer; justify-content: space-between;">
          <div style="font-weight: 500; color: #475569;">
            Review Draft (Multi-select)
          </div>
          <div style="display: flex; gap: 12px; align-items: center;">
            <button class="btn-outline clear-results-btn" style="padding: 4px 12px; font-size: 12px; color: #0284c7; border-color: #0284c7;" (click)="addGroup(); $event.stopPropagation()">+ Add Group</button>
            <button class="btn-outline clear-results-btn" style="padding: 4px 12px; font-size: 12px;" (click)="clearSuggestions(); $event.stopPropagation()">Clear Suggestion Group</button>
            <button class="btn-outline clear-results-btn" style="padding: 4px 12px; font-size: 12px;" (click)="clearResults(); $event.stopPropagation()">Clear All</button>
            <svg style="width: 20px; height: 20px; transition: transform 0.2s; color: #64748b;" [class.rotate-180]="isMultiSelectOpen" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </div>
        </div>
        
        <div *ngIf="isMultiSelectOpen" class="accordion-body" style="padding: 16px; background: #ffffff; border-top: 1px solid #e2e8f0;">
          <div style="display: flex; flex-direction: column; gap: 16px;">
            <div *ngFor="let group of groupedAllDrafts; let gIdx = index"
                 (dragover)="onDragOver($event)"
                 (drop)="onDrop($event, group.groupId)"
                 style="border: 1px dashed #cbd5e1; border-radius: 8px; padding: 12px; min-height: 60px; background-color: #f8fafc;"
                 [style.borderTop]="group.color ? '4px solid ' + group.color : '1px dashed #cbd5e1'">
              <div style="font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 8px;">
                 {{ group.color ? 'Group ' + (gIdx + 1) : 'Ungrouped' }}
              </div>
              <div style="display: flex; gap: 8px; flex-wrap: wrap; min-height: 32px;">
                <button *ngFor="let review of group.drafts"
                        draggable="true"
                        (dragstart)="onDragStart($event, getDraftIndex(review))"
                        class="pill-btn"
                        style="cursor: grab;"
                        [class.selected]="isDraftSelected(getDraftIndex(review))"
                        [ngStyle]="getGroupStyle(review, getDraftIndex(review))"
                        (click)="toggleSelection(getDraftIndex(review))">
                  {{ getDraftIndex(review) + 1 }}. {{ review.source_name }} ({{ review.details_confirmed ? 'Ready' : 'Draft' }})
                </button>
                <div *ngIf="group.drafts.length === 0" style="color: #94a3b8; font-size: 12px; font-style: italic; padding: 6px;">
                  Drag PDFs here
                </div>
              </div>
            </div>
            
            <div (dragover)="onDragOver($event)"
                 (drop)="onDrop($event, null)"
                 style="border: 2px dashed #94a3b8; border-radius: 8px; padding: 16px; min-height: 80px; background-color: #f1f5f9;">
              <div style="font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 8px;">Ungrouped Files (Drag here to ungroup)</div>
              
              <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                <button *ngFor="let review of ungroupedDrafts"
                        draggable="true"
                        (dragstart)="onDragStart($event, getDraftIndex(review))"
                        class="pill-btn"
                        style="cursor: grab;"
                        [class.selected]="isDraftSelected(getDraftIndex(review))"
                        [ngStyle]="getGroupStyle(review, getDraftIndex(review))"
                        (click)="toggleSelection(getDraftIndex(review))">
                  {{ getDraftIndex(review) + 1 }}. {{ review.source_name }} ({{ review.details_confirmed ? 'Ready' : 'Draft' }})
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="review-content">
        <div *ngIf="selectedDraftIndices.size > 0 && !mblReview">
          <app-hbl-draft 
            *ngFor="let group of groupedSelectedDrafts"
            [drafts]="group.drafts"
            [groupColor]="group.color"
            (generateRequested)="generateHbl($event)"
          ></app-hbl-draft>
        </div>

        <app-mbl-section 
          *ngIf="canShowMbl() && mblReview"
          [reviews]="hblReviews"
          [mblReview]="mblReview"
          (generateRequested)="generateMbl()"
        ></app-mbl-section>
      </div>
    </div>
  </main>

  <app-wifi-loader [show]="isExtracting" text="extracting"></app-wifi-loader>
  <app-wifi-loader [show]="isGenerating" text="generating"></app-wifi-loader>
</div>
